<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
</head>
<!-- Inline styles: most mail clients drop <style> blocks. The brand (M12) sets these values. -->
<body style="margin: 0; padding: 24px; background: #f3f4f6; color: #1f2937;
             font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; line-height: 1.5;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; padding: 24px;
              border: 1px solid #d1d5db;">
    <p style="margin: 0 0 16px; font-size: 18px; font-weight: bold; color: #1e40af;">{{ tenant }}</p>
    {% block body %}{% endblock %}
    <p style="margin: 24px 0 0; font-size: 12px; color: #4b5563;">
      {{ tenant }} · sent with Pricewright
    </p>
  </div>
</body>
</html>
