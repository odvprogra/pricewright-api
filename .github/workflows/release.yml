name: Release

# release-please (docs/adr/0002): keeps a release PR up to date from the Conventional Commits on main.
# Merging it tags the version and creates a draft release. The publish job then pushes the container
# image to GHCR with a build provenance attestation, writes its digest into the notes, attaches
# openapi.json and publishes the release. Published releases are immutable, so everything they
# carry is added while they are drafts.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never interrupt a release halfway

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    name: Release PR and release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: events created with GITHUB_TOKEN start no workflows,
      # so CI would never run on the release PR and the ruleset on main would block it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only this job may push packages and sign attestations, and only when a release was created.
  publish:
    name: Publish the image and the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore signs the attestation with the workflow's OIDC identity
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Before anything is pushed: a mismatch means the release PR missed a file.
      - name: openapi.json carries the release's version
        run: |
          spec_version="$(jq --raw-output .info.version openapi.json)"
          if [ "$spec_version" != "$VERSION" ]; then
            echo "::error::openapi.json says $spec_version, the release is $VERSION"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the tag without a layer cache, so nothing from another run reaches the release.
      # The source label links the package to this repository on GHCR.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=pricewright-api
            org.opencontainers.image.description=Pricewright's quote-to-order API and its worker.

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      # Outputs reach the shell as environment variables, never as ${{ }} inside run:.
      - name: Write the image into the notes, attach openapi.json and publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"
          # The backticks are Markdown code spans, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '\n### Container image\n\n'
            printf '`%s:%s`, pinned by digest:\n\n' "$IMAGE" "$VERSION"
            printf '```text\n%s@%s\n```\n\n' "$IMAGE" "$DIGEST"
            printf 'Verify its build provenance with\n'
            printf '`gh attestation verify oci://%s@%s --repo %s`.\n' "$IMAGE" "$DIGEST" "$GITHUB_REPOSITORY"
          } >> "$notes"
          gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" openapi.json --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
