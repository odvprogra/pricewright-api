name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: odvprogra/engineering-standards/.github/workflows/python-ci.yml@v1
    with:
      # WeasyPrint's text layout for the quote PDFs (ADR-0027); the runner lacks HarfBuzz-Subset.
      system-packages: libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
    secrets: inherit

  security:
    uses: odvprogra/engineering-standards/.github/workflows/security.yml@v1

  docker:
    uses: odvprogra/engineering-standards/.github/workflows/docker-build.yml@v1
    with:
      compose-file: docker-compose.yml # readiness needs PostgreSQL
