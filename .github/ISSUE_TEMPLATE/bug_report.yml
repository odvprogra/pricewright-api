name: Bug report
description: Something does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened, and where that is documented if it is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant log lines, including the request_id if there is one. Never paste secrets, tokens or
        personal data.
      render: text
