# Local infrastructure (`just dev` and `just worker` start only postgres) and the full stack for
# the CI smoke test (`docker compose up --wait`). Tests start their own database with testcontainers.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pricewright
    ports:
      # Another PostgreSQL on the machine may hold 5432: set POSTGRES_PORT (and DATABASE_URL) in .env.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pricewright"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/pricewright
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["pricewright-api-worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/pricewright
      ENVIRONMENT: local
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Catches the worker's emails locally (ADR-0028): http://localhost:8025 shows them.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
